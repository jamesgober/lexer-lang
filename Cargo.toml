# =============================================================================
#  R E P S   ·   lexer-lang
# =============================================================================
[package]
name    = "lexer-lang"
version = "1.0.1"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Scanner/tokenizer core for hand-written and generated lexers."

# Keywords (5 max)
keywords = ["compiler", "lexer", "language", "tokenizer"]

# Categories
categories = ["development-tools", "parsing"]

# Links
homepage      = "https://github.com/jamesgober/lexer-lang"
repository    = "https://github.com/jamesgober/lexer-lang"
documentation = "https://docs.rs/lexer-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lexer_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Pull in the standard library; forwarded to the family crates the cursor uses.
std = ["span-lang/std", "token-lang/std", "intern-lang/std", "source-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# Byte positions and spans the cursor reports as it scans.
span-lang = { version = "0.4", default-features = false }
# The token type the cursor emits.
token-lang = { version = "1", default-features = false }
# Interning identifiers and keywords scanned from source.
intern-lang = { version = "1", default-features = false }
# Source files the cursor scans, for global-position spans.
source-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Used only to show, in an integration test, that a lexer turns a cursor span into
# a rendered diagnostic — lexer-lang itself does not depend on diag-lang.
diag-lang = "0.4"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
